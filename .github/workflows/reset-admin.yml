name: Secure Admin Password Reset

on:
  workflow_dispatch:

jobs:
  reset-admin:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y lftp php-cli
        
      - name: Download users.json via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Connecting to FTP to retrieve users.json..."
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; get api/data/users.json -o users.json; quit" || lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get api/data/users.json -o users.json; quit"
          
          if [ ! -f users.json ]; then
            echo "Failed to download users.json. It may not exist on the server or FTP path is incorrect."
            exit 1
          fi

      - name: Safely Update Password (Local on Runner)
        run: |
          php -r '
            $file = "users.json";
            $content = file_get_contents($file);
            if (empty($content)) {
                echo "users.json is empty.\n";
                exit(1);
            }
            $users = json_decode($content, true);
            if (!is_array($users) || empty($users)) {
                echo "No users found in users.json.\n";
                exit(1);
            }
            
            $username = $users[0]["username"];
            $users[0]["password_hash"] = password_hash("QuranAdmin!2026#Safe", PASSWORD_DEFAULT);
            
            file_put_contents($file, json_encode($users, JSON_PRETTY_PRINT));
            echo "========================================================\n";
            echo "SUCCESS: Updated password for existing admin: " . $username . "\n";
            echo "========================================================\n";
          '
          
      - name: Upload users.json back via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Connecting to FTP to upload modified users.json..."
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; put users.json -o api/data/users.json; quit" || lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put users.json -o api/data/users.json; quit"
          echo "Upload complete. The admin password has been safely updated."
